<text x="80" y="886" fill="#203047" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20">三路 PWM 独立：PWM10/11/12 → PH11/PH12/PI0，不短接。</text>
<text x="80" y="926" fill="#596B80" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">左前/云台/右前与通道对应待核；SUB 现有软件仍以同一灯光状态同步控制三路。</text>
<text x="80" y="966" fill="#203047" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">预留 9P 由复刻者自行接线；不预设电源、地或信号。24V/GND 接法按本机方案记录。</text>
<text x="80" y="1006" fill="#94600C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">互联件间距/电流/适配、线径线长、其余保护路径和实际通断结果仍需补录。</text>
